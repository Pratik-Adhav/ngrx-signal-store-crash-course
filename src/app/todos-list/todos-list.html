<section class="todos-list">
    <h2>Todo list</h2>

    <mat-form-field class="todos-input" appearance="outline">
        <mat-label>New todo</mat-label>
        <input matInput #input (keyup.enter)="onAddTodo(input.value)" placeholder="What needs to be done?" />
        <mat-icon matSuffix>edit</mat-icon>
    </mat-form-field>
    <mat-button-toggle-group class="todos-filter" #filter (change)="onFilterTodos($event)">
        <mat-button-toggle value="all">All</mat-button-toggle>
        <mat-button-toggle value="pending">Pending</mat-button-toggle>
        <mat-button-toggle value="completed">Completed</mat-button-toggle>
    </mat-button-toggle-group>
    <mat-selection-list>
        @for (todo of store.filteredTodos(); track todo.id; let index = $index) {
        <mat-list-option class="todo-option" togglePosition="before" [selected]="todo.completed">
            <div class="todo-item">
                <span class="todo-title">{{ todo.title }}</span>
                <button matIconButton class="todo-delete" type="button" aria-label="Delete todo"
                    (click)="$event.stopPropagation()"
                    (mousedown)="$event.stopPropagation()"
                    (keydown)="$event.stopPropagation()">
                    <mat-icon (click)="onDeleteTodo(todo.id, $event)">delete</mat-icon>
                </button>
            </div>
        </mat-list-option>
        }
    </mat-selection-list>
</section>
